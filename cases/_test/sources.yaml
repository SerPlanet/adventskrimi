sources:
  - {
      id: src_anna,
      kind: talk,
      room: halle,
      npc: anna,
      topic: nacht,
      days: { from: 1, to: 3 },
      yields: [f_excl_ben],
    }
  - {
      id: src_ben,
      kind: talk,
      room: keller,
      npc: ben,
      topic: nacht,
      days: { from: 1, to: 3 },
      yields: [s_ben_keller, f_excl_ben_acc],
    }
  - {
      id: src_cora,
      kind: talk,
      room: halle,
      npc: cora,
      topic: nacht,
      days: { from: 1, to: 3 },
      yields: [s_cora_halle],
      auffaellig: true,
    }
  - {
      id: src_lampe,
      kind: inspect,
      room: halle,
      object: lampe,
      days: [1, 2, 3],
      auffaellig: true,
      yields: [f_cora_keller],
      plaque: Sehr aufmerksam,
    }
  - {
      id: src_kiste,
      kind: inspect,
      room: keller,
      object: kiste,
      days: [2, 3],
      requires: p_code,
      auffaellig: true,
      yields: [f_kiste_offen, f_ben_keller],
    }
  - {
      id: src_lampe2,
      kind: inspect,
      room: halle,
      object: lampe,
      days: [2, 3],
      yields: [f_lampe_an],
    }
  - { id: src_news_a, kind: newspaper, days: [1, 2, 3], yields: [f_excl_ben, f_lampe_an] }
  - {
      id: src_book_a,
      kind: hotelbook,
      room: halle,
      days: [1, 2, 3],
      yields: [f_excl_ben, f_excl_ben_acc],
    }
  - { id: src_news_b, kind: newspaper, days: [2, 3], yields: [f_excl_ben_acc, f_kiste_offen] }
  - {
      id: src_book_b,
      kind: hotelbook,
      room: keller,
      days: [2, 3],
      yields: [f_lampe_an, f_kiste_offen],
    }
  - {
      id: src_ben2,
      kind: talk,
      room: keller,
      npc: ben,
      topic: nacht,
      days: [3],
      yields: [f_lampe_an, f_excl_ben],
    }
